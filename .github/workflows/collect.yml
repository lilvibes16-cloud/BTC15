name: Coin Lens research collector
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'scripts/github-collector.mjs'
permissions:
  contents: read
  id-token: write
concurrency:
  group: coin-lens-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sample market data and persist outcomes
        env:
          COLLECTOR_TICKS: 60
        run: node scripts/github-collector.mjs
